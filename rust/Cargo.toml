[package]
name = "keyhunt-pvk"
version = "0.1.0"
edition = "2021"
description = "CUDA keyhunt PVK - Rust host, CUDA core"
authors = ["keyhunt-pvk"]
rust-version = "1.70"

[dependencies]
# Config & serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP
reqwest = { version = "0.12", features = ["json", "blocking"] }

# Crypto (AES-GCM for results.enc, match C++)
aes-gcm = "0.10"
hex = "0.4"

# Logging
log = "0.4"
env_logger = "0.11"

# Concurrency
crossbeam-channel = "0.5"

# Time & formatting
chrono = "0.4"
num-format = "0.4"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

[build-dependencies]
cc = "1.0"

[features]
default = []
# Build with CUDA lib (set KEYHUNT_CUDA_LIB or build cuda first)
cuda = []
