[package]
name = "keyhunt-pvk"
version = "0.1.0"
edition = "2021"
description = "CUDA keyhunt PVK - Rust host, CUDA core"
authors = ["keyhunt-pvk"]
rust-version = "1.70"

[dependencies]
# Config & serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP
reqwest = { version = "0.12", features = ["json", "blocking"] }

# Crypto (AES-GCM for results.enc, match C++)
aes-gcm = "0.10"
hex = "0.4"

# Logging
log = "0.4"
env_logger = "0.11"

# Concurrency
crossbeam-channel = "0.5"

# Time & formatting
chrono = "0.4"
num-format = "0.4"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Fast file I/O
memmap2 = "0.9"

# CUDA runtime (only for gpu_info binary)
# One of cuda-version-from-build-system or cuda-11* / cuda-12* must be enabled when using gpu-info
cudarc = { version = "0.13", optional = true, features = ["cuda-11080"] }

[build-dependencies]
cc = "1.0"

[[bin]]
name = "decrypt_results"
path = "src/bin/decrypt_results.rs"

[[bin]]
name = "convert_hash160_to_binary"
path = "src/bin/convert_hash160_to_binary.rs"

[[bin]]
name = "gpu_info"
path = "src/bin/gpu_info.rs"
required-features = ["gpu-info"]

[features]
default = []
# Build with keyhunt CUDA lib (set KEYHUNT_CUDA_LIB_DIR, build cuda first)
cuda = []
# For gpu_info binary: CUDA runtime only (cudarc). Pick a cuda-* feature if needed.
gpu-info = ["cudarc", "cudarc/cuda-version-from-build-system"]
